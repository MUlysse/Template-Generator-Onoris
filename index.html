<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onoris Journal &#8211; Generateur LinkedIn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Display:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2f2f0; --panel: #ffffff; --card: #f7f7f5;
      --border: #d4d4d0; --border-s: #b0b0aa;
      --text: #111111; --muted: #888882;
      --ok: #2a6e2a; --err: #b82020;
      --btn: #111111; --btn-txt: #ffffff; --r: 3px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; line-height: 1.5; }
    .app { display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 340px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #sidebar-head { padding: 20px 22px 18px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
    .brand-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: var(--muted); padding: 2px 7px; border: 1px solid var(--border); border-radius: 2px; }
    .brand-sub { font-size: 11.5px; color: var(--muted); }
    #form-body { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .field > label > em { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; color: #bbb; }
    input[type="text"], textarea { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-family: inherit; font-size: 13px; padding: 9px 11px; width: 100%; outline: none; transition: border-color 0.12s; }
    input[type="text"]:focus, textarea:focus { border-color: var(--border-s); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .dz { border: 1px dashed var(--border); border-radius: var(--r); padding: 18px 14px; text-align: center; cursor: pointer; transition: border-color 0.12s, background 0.12s; user-select: none; background: var(--card); }
    .dz:hover, .dz.over { border-color: var(--border-s); background: #f0f0ee; }
    .dz.filled { border-style: solid; border-color: var(--ok); }
    .dz .ico { font-size: 20px; line-height: 1; margin-bottom: 4px; }
    .dz .lbl { font-size: 12px; color: var(--text); }
    .dz .lbl strong { font-weight: 600; }
    .dz.filled .lbl strong { color: var(--ok); }
    .dz .hint { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
    input[type="file"] { display: none; }
    .sep { height: 1px; background: var(--border); border: none; }
    #sidebar-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    #status { font-size: 11px; color: var(--muted); text-align: center; min-height: 14px; }
    #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    #btn-dl { width: 100%; padding: 11px 16px; background: var(--btn); color: var(--btn-txt); border: none; border-radius: var(--r); font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; transition: opacity 0.12s; }
    #btn-dl:hover:not(:disabled) { opacity: 0.80; }
    #btn-dl:disabled { opacity: 0.28; cursor: not-allowed; }
    #preview { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px 32px; background: var(--bg); overflow: auto; }
    .prev-label { font-size: 10px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
    #canvas-shell { line-height: 0; border-radius: 2px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.10), 0 8px 32px rgba(0,0,0,0.14); }
    #canvas { display: block; }
    .prev-meta { font-size: 10.5px; color: var(--muted); flex-shrink: 0; }
  </style>
</head>
<body>
<div aria-hidden="true" style="position:fixed;top:-9999px;opacity:0;pointer-events:none;font-size:1px;">
  <b style="font-family:'Inter'">x</b>
  <i style="font-family:'Noto Serif Display'">x</i>
  <span style="font-family:'Open Sans'">x</span>
</div>
<div class="app">
  <aside id="sidebar">
    <div id="sidebar-head">
      <div class="brand">
        <span class="brand-name">Onoris Journal</span>
        <span class="brand-tag">1 080 &#215; 1 080</span>
      </div>
      <div class="brand-sub">Generateur de visuels LinkedIn</div>
    </div>
    <div id="form-body">
      <div class="field">
        <label>Image de fond</label>
        <div class="dz" id="dz-bg">
          <div class="ico">&#128444;</div>
          <p class="lbl"><strong>Cliquer ou deposer</strong> l&#8217;image</p>
          <p class="hint">JPG &middot; PNG &middot; WEBP &middot; AVIF</p>
        </div>
        <input type="file" id="fi-bg" accept="image/*">
      </div>
      <hr class="sep">
      <div class="field">
        <label>Rubrique</label>
        <input type="text" id="inp-rub" value="GEOPOLITICS" placeholder="GEOPOLITIQUE, ECONOMIE...">
      </div>
      <div class="field">
        <label>Titre</label>
        <textarea id="inp-titre" placeholder="Titre de l'article...">Mali Is the Linchpin of West Africa &#8211; Now It&#8217;s Under Jihadist Siege</textarea>
      </div>
      <div class="field">
        <label>Auteur</label>
        <input type="text" id="inp-auteur" value="" placeholder="Pr&#233;nom NOM">
      </div>
      <div class="field">
        <label>Cr&#233;dit photo <em>(optionnel)</em></label>
        <input type="text" id="inp-credit" value="" placeholder="&#169; Agence / Photographe">
      </div>
    </div>
    <div id="sidebar-foot">
      <div id="status">En attente d&#8217;une image&#8230;</div>
      <button id="btn-dl" disabled>&#8595;&nbsp; Generer &amp; Telecharger .PNG</button>
    </div>
  </aside>
  <main id="preview">
    <span class="prev-label">Apercu en temps reel</span>
    <div id="canvas-shell"><canvas id="canvas"></canvas></div>
    <span class="prev-meta">1 080 &#215; 1 080 px &middot; Format 1:1 &middot; PNG haute resolution</span>
  </main>
</div>

var ctx      = canvas.getContext('2d');
var dzBg     = document.getElementById('dz-bg');

var inpCredit= document.getElementById('inp-credit');

canvas.width = W; canvas.height = H;

var bgImage        = null;
var logoWhiteCanvas = null;

function buildWhiteLogo(img) {
  var tc  = document.createElement('canvas');
  tc.width = img.naturalWidth; tc.height = img.naturalHeight;
  var tc2 = tc.getContext('2d');
  tc2.drawImage(img, 0, 0);
  var id = tc2.getImageData(0, 0, tc.width, tc.height);
  var px = id.data;
  for (var i = 0; i < px.length; i += 4) {
    if (px[i+3] === 0) continue;
    var lum = px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114;
    var a   = Math.max(0, Math.min(255, Math.round((210 - lum) / 210 * 255)));
    a = Math.round(a * px[i+3] / 255);
    px[i] = 255; px[i+1] = 255; px[i+2] = 255; px[i+3] = a;
  }
  tc2.putImageData(id, 0, 0);
  return tc;
}

dzBg.addEventListener('click', function() { fiBg.click(); });
fiBg.addEventListener('change', function(e) { if (e.target.files[0]) loadBg(e.target.files[0]); });
dzBg.addEventListener('dragover', function(e) { e.preventDefault(); dzBg.classList.add('over'); });
['dragleave','dragend'].forEach(function(ev) { dzBg.addEventListener(ev, function() { dzBg.classList.remove('over'); }); });
dzBg.addEventListener('drop', function(e) {
  e.preventDefault(); dzBg.classList.remove('over');
  var f = e.dataTransfer.files[0];
  if (f) loadBg(f);
});
function loadBg(file) {
  var r = new FileReader();
  r.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      bgImage = img;
      dzBg.classList.add('filled');
      dzBg.innerHTML = '<div class="ico">&#9989;</div><p class="lbl"><strong>' + safe(file.name) + '</strong></p>';
      btnDl.disabled = false;
      setStatus('');
      render();
    };
    img.onerror = function() { setStatus('Image illisible', 'err'); };
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}


[inpRub, inpTitre, inpAuteur, inpCredit].forEach(function(el) { el.addEventListener('input', render); });
function setStatus(msg, cls) { statusEl.innerHTML = msg; statusEl.className = cls || ''; }
function safe(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Telechargement ──────────────────────────────────────────── */
btnDl.addEventListener('click', function() {
  render();
  var slug = (inpTitre.value || 'onoris-visuel').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);
  var a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'onoris-' + slug + '.png';
  a.click();
  setStatus('Telechargement lance &#10003;', 'ok');
});

/* ================================================================
   RENDU CANVAS
================================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);
  if (!bgImage) {
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.font = '500 20px "Inter", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Deposez une image pour commencer', W/2, H/2);
    ctx.restore();
    return;
  }
  drawBgImage();
  drawOverlay();
  var rub = drawRubrique();
  var titleBottom = drawTitle(rub.bottom + RUB_GAP);
  drawAuthor(titleBottom + TTL_GAP);
  drawCredit();
  drawLogo();
}

function drawBgImage() {
  var iw = bgImage.naturalWidth, ih = bgImage.naturalHeight;
  var scale = Math.max(W/iw, H/ih);
  var sw = iw*scale, sh = ih*scale;
  ctx.drawImage(bgImage, (W-sw)/2, (H-sh)/2, sw, sh);
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, 0, W, H);
  var top = ctx.createLinearGradient(0, 0, 0, H*0.58);
  top.addColorStop(0.00, 'rgba(0,0,0,0.70)');
  top.addColorStop(0.40, 'rgba(0,0,0,0.22)');
  top.addColorStop(1.00, 'rgba(0,0,0,0.00)');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, H*0.58);
  var bot = ctx.createLinearGradient(0, H*0.68, 0, H);
  bot.addColorStop(0.0, 'rgba(0,0,0,0.00)');
  bot.addColorStop(1.0, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = bot; ctx.fillRect(0, H*0.68, W, H*0.32);
}

function drawRubrique() {
  var text = (inpRub.value.trim() || 'RUBRIQUE').toUpperCase();
  var FS = 26, PAD_H = 14, PAD_V = 9;
  ctx.save();
  ctx.font = '700 ' + FS + 'px "Inter", sans-serif';
  ctx.letterSpacing = '1.4px';
  var tw = ctx.measureText(text).width;
  var rectW = tw + PAD_H*2, rectH = FS + PAD_V*2;
  ctx.fillStyle = RUB_BG;
  if (typeof ctx.roundRect === 'function') {
    ctx.beginPath(); ctx.roundRect(ML, RUB_TOP, rectW, rectH, 3); ctx.fill();
  } else { ctx.fillRect(ML, RUB_TOP, rectW, rectH); }
  ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText(text, ML+PAD_H, RUB_TOP+PAD_V);
  ctx.restore();
  return { bottom: RUB_TOP + rectH };
}

function drawTitle(startY) {
  var text = inpTitre.value || '';
  var FS = 68, LINE_H = FS * 1.18, MAX_W = W - ML - MR;
  ctx.save();
  ctx.font = '400 ' + FS + 'px "Noto Serif Display", Georgia, serif';
  ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.letterSpacing = '0px';
  var lines = wordWrap(ctx, text, MAX_W);
  for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], ML, startY + i*LINE_H);
  ctx.restore();
  return startY + lines.length * LINE_H;
}

function drawAuthor(startY) {
  var text = inpAuteur.value.trim();
  if (!text) return;
  ctx.save();
  ctx.font = '400 25px "Open Sans", Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.90)'; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.letterSpacing = '0px';
  ctx.fillText(text, ML, startY);
  ctx.restore();
}

function drawCredit() {
  var text = inpCredit.value.trim();
  if (!text) return;
  ctx.save();
  ctx.font = '400 21px "Open Sans", Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.78)'; ctx.textBaseline = 'bottom'; ctx.textAlign = 'left'; ctx.letterSpacing = '0px';
  ctx.fillText(text, CREDIT_X, H - CREDIT_BOT);
  ctx.restore();
}

function drawLogo() {
  if (!logoWhiteCanvas) return;
  var lh = LOGO_H;
  var lw = logoWhiteCanvas.width * (lh / logoWhiteCanvas.height);
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(logoWhiteCanvas, W - LOGO_MARGIN - lw, H - LOGO_MARGIN - lh, lw, lh);
  ctx.restore();
}

function wordWrap(c, text, maxWidth) {
  if (!text) return [''];
  var out = [], paras = text.split('\n');
  for (var p = 0; p < paras.length; p++) {
    var para = paras[p];
    if (!para.trim()) { out.push(''); continue; }
    var words = para.split(/\s+/).filter(Boolean), line = '';
    for (var w = 0; w < words.length; w++) {
      var cand = line ? line + ' ' + words[w] : words[w];
      if (c.measureText(cand).width > maxWidth && line) { out.push(line); line = words[w]; }
      else { line = cand; }
    }
    if (line) out.push(line);
  }
  return out;
}

render();
</script>
