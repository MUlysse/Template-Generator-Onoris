<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onoris Journal &#8211; Generateur LinkedIn</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Display:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       RESET
    ========================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ==========================================================
       VARIABLES — DA claire, noir & blanc, classique
    ========================================================== */
    :root {
      --bg:       #f2f2f0;
      --panel:    #ffffff;
      --card:     #f7f7f5;
      --border:   #d4d4d0;
      --border-s: #b0b0aa;
      --text:     #111111;
      --muted:    #888882;
      --ok:       #2a6e2a;
      --err:      #b82020;
      --btn:      #111111;
      --btn-txt:  #ffffff;
      --accent:   #111111;
      --r:        3px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* ==========================================================
       LAYOUT
    ========================================================== */
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ==========================================================
       PANNEAU GAUCHE
    ========================================================== */
    #sidebar {
      width: 340px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* En-tete */
    #sidebar-head {
      padding: 20px 22px 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 3px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .brand-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 2px 7px;
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Corps scrollable */
    #form-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Groupe champ */
    .field { display: flex; flex-direction: column; gap: 6px; }

    .field > label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field > label > em {
      font-style: normal;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #bbb;
    }

    input[type="text"], textarea {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 11px;
      width: 100%;
      outline: none;
      transition: border-color 0.12s;
    }

    input[type="text"]:focus,
    textarea:focus { border-color: var(--border-s); }

    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

    /* Zone de depot */
    .dz {
      border: 1px dashed var(--border);
      border-radius: var(--r);
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      user-select: none;
      background: var(--card);
    }

    .dz:hover, .dz.over {
      border-color: var(--border-s);
      background: #f0f0ee;
    }

    .dz.filled { border-style: solid; border-color: var(--ok); }

    .dz .ico { font-size: 22px; line-height: 1; margin-bottom: 5px; }
    .dz .lbl { font-size: 12px; color: var(--text); }
    .dz .lbl strong { font-weight: 600; }
    .dz.filled .lbl strong { color: var(--ok); }
    .dz .hint { font-size: 10.5px; color: var(--muted); margin-top: 3px; }

    input[type="file"] { display: none; }

    .sep { height: 1px; background: var(--border); border: none; }

    /* Pied */
    #sidebar-foot {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #status {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      min-height: 14px;
    }
    #status.ok  { color: var(--ok); }
    #status.err { color: var(--err); }

    #btn-dl {
      width: 100%;
      padding: 11px 16px;
      background: var(--btn);
      color: var(--btn-txt);
      border: none;
      border-radius: var(--r);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    #btn-dl:hover:not(:disabled) { opacity: 0.80; }
    #btn-dl:disabled { opacity: 0.28; cursor: not-allowed; }

    /* ==========================================================
       APERCU
    ========================================================== */
    #preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 28px 32px;
      background: var(--bg);
      overflow: auto; /* scroll si la fenetre est trop petite */
    }

    .prev-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }

    #canvas-shell {
      line-height: 0;
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 8px 32px rgba(0,0,0,0.14);
    }

    #canvas { display: block; }

    .prev-meta {
      font-size: 10.5px;
      color: var(--muted);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- Preload polices pour canvas (evite le fallback au premier rendu) -->
<div aria-hidden="true" style="position:fixed;top:-9999px;opacity:0;pointer-events:none;font-size:1px;">
  <b style="font-family:'Inter'">x</b>
  <i style="font-family:'Noto Serif Display'">x</i>
  <span style="font-family:'Open Sans'">x</span>
</div>

<div class="app">

  <!-- ============================================================
       PANNEAU GAUCHE — Formulaire
  ============================================================ -->
  <aside id="sidebar">

    <div id="sidebar-head">
      <div class="brand">
        <span class="brand-name">Onoris Journal</span>
        <span class="brand-tag">1 080 &#215; 1 350</span>
      </div>
      <div class="brand-sub">Generateur de visuels LinkedIn</div>
    </div>

    <div id="form-body">

      <!-- Image de fond -->
      <div class="field">
        <label>Image de fond</label>
        <div class="dz" id="dz-bg">
          <div class="ico">&#128444;</div>
          <p class="lbl"><strong>Cliquer ou deposer</strong> l&#8217;image</p>
          <p class="hint">JPG &middot; PNG &middot; WEBP &middot; AVIF</p>
        </div>
        <input type="file" id="fi-bg" accept="image/*">
      </div>

      <!-- Logo -->
      <div class="field">
        <label>Logo O&#8217; <em>(PNG blanc, fond transparent)</em></label>
        <div class="dz" id="dz-logo">
          <div class="ico">&#9711;</div>
          <p class="lbl"><strong>Deposer</strong> le logo PNG</p>
          <p class="hint">Fond transparent recommande</p>
        </div>
        <input type="file" id="fi-logo" accept="image/png,image/svg+xml">
      </div>

      <hr class="sep">

      <!-- Rubrique -->
      <div class="field">
        <label>Rubrique</label>
        <input type="text" id="inp-rub" value="GEOPOLITICS" placeholder="GEOPOLITIQUE, ECONOMIE...">
      </div>

      <!-- Titre -->
      <div class="field">
        <label>Titre</label>
        <textarea id="inp-titre" placeholder="Titre de l'article...">Mali Is the Linchpin of West Africa &#8211; Now It&#8217;s Under Jihadist Siege</textarea>
      </div>

      <!-- Auteur -->
      <div class="field">
        <label>Auteur</label>
        <input type="text" id="inp-auteur" value="By Louis Dubois-Delsart" placeholder="By Prenom NOM">
      </div>

      <!-- Credit -->
      <div class="field">
        <label>Credit photo <em>(vide = masque)</em></label>
        <input type="text" id="inp-credit" placeholder="Photo : AFP / Getty Images">
      </div>

    </div><!-- /#form-body -->

    <div id="sidebar-foot">
      <div id="status">En attente d&#8217;une image&#8230;</div>
      <button id="btn-dl" disabled>&#8595;&nbsp; Generer &amp; Telecharger .PNG</button>
    </div>

  </aside>

  <!-- ============================================================
       APERCU CANVAS
  ============================================================ -->
  <main id="preview">
    <span class="prev-label">Apercu en temps reel</span>
    <div id="canvas-shell"><canvas id="canvas"></canvas></div>
    <span class="prev-meta">1 080 &#215; 1 350 px &middot; Format 4:5 &middot; PNG haute resolution</span>
  </main>

</div><!-- /.app -->


<script>
/* ================================================================
   ONORIS JOURNAL — GENERATEUR DE VISUELS LINKEDIN
   ----------------------------------------------------------------
   Format  : 1 080 x 1 350 px (ratio 4:5)
   Couches : image cover → overlay → rubrique → titre → auteur
             → credit photo → logo PNG
================================================================ */

/* ── Dimensions canvas (pixels internes = resolution export) ─── */
var W = 1080, H = 1350;

/* ── Positionnement (px sur base 1080 x 1350) ───────────────── */
var ML          = 80;   // marge gauche (rubrique, titre, auteur)
var MR          = 80;   // marge droite (word-wrap titre)
var RUB_TOP     = 130;  // Y haut du rectangle rubrique
var RUB_GAP     = 44;   // espace rubrique → titre
var TTL_GAP     = 34;   // espace titre → auteur
var CREDIT_X    = 52;   // X credit photo
var CREDIT_BOT  = 55;   // distance credit depuis bord bas
var LOGO_MARGIN = 48;   // marge bas-droite logo
var LOGO_H      = 110;  // hauteur cible du logo en px canvas

/* ── Couleur fond rubrique ───────────────────────────────────── */
var RUB_BG = '#2A3342';

/* ── DOM ─────────────────────────────────────────────────────── */
var canvas   = document.getElementById('canvas');
var ctx      = canvas.getContext('2d');
var dzBg     = document.getElementById('dz-bg');
var fiBg     = document.getElementById('fi-bg');
var dzLogo   = document.getElementById('dz-logo');
var fiLogo   = document.getElementById('fi-logo');
var btnDl    = document.getElementById('btn-dl');
var statusEl = document.getElementById('status');
var inpRub   = document.getElementById('inp-rub');
var inpTitre = document.getElementById('inp-titre');
var inpAuteur= document.getElementById('inp-auteur');
var inpCredit= document.getElementById('inp-credit');

/* ── Resolution interne ──────────────────────────────────────── */
canvas.width  = W;
canvas.height = H;

/* ── Etat ────────────────────────────────────────────────────── */
var bgImage   = null;
var logoImage = null;

/* ── Taille d'affichage (maintient le ratio 4:5) ────────────── */
function fitCanvas() {
  var panelW  = 340;
  var padPrev = 60;   // padding horizontal de la zone apercu
  var padVert = 72;   // padding vertical + labels

  var availW = window.innerWidth  - panelW - padPrev;
  var availH = window.innerHeight - padVert;

  /* On contraint par la dimension la plus limitante */
  var ratio = W / H;          // 4/5 = 0.8
  var byW   = availW;
  var byH   = availH * ratio; // largeur max si contrainte par hauteur

  var dispW = Math.floor(Math.min(byW, byH, 500));
  var dispH = Math.floor(dispW / ratio);

  canvas.style.width  = dispW + 'px';
  canvas.style.height = dispH + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

/* ================================================================
   CHARGEMENT DES POLICES
================================================================ */
document.fonts.ready.then(render);

/* ================================================================
   UPLOAD IMAGE DE FOND
================================================================ */
dzBg.addEventListener('click', function() { fiBg.click(); });
fiBg.addEventListener('change', function(e) {
  if (e.target.files[0]) loadBg(e.target.files[0]);
});
dzBg.addEventListener('dragover', function(e) {
  e.preventDefault(); dzBg.classList.add('over');
});
['dragleave','dragend'].forEach(function(ev) {
  dzBg.addEventListener(ev, function() { dzBg.classList.remove('over'); });
});
dzBg.addEventListener('drop', function(e) {
  e.preventDefault(); dzBg.classList.remove('over');
  var f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadBg(f);
});

function loadBg(file) {
  var r = new FileReader();
  r.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      bgImage = img;
      dzBg.classList.add('filled');
      dzBg.innerHTML =
        '<div class="ico">&#9989;</div>' +
        '<p class="lbl"><strong>' + safe(file.name) + '</strong></p>' +
        '<p class="hint">' + img.naturalWidth + ' &#215; ' + img.naturalHeight + ' px</p>';
      btnDl.disabled = false;
      setStatus('Apercu pret &#10003;', 'ok');
      render();
    };
    img.onerror = function() { setStatus('Image illisible', 'err'); };
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}

/* ================================================================
   UPLOAD LOGO
================================================================ */
dzLogo.addEventListener('click', function() { fiLogo.click(); });
fiLogo.addEventListener('change', function(e) {
  if (e.target.files[0]) loadLogo(e.target.files[0]);
});
dzLogo.addEventListener('dragover', function(e) {
  e.preventDefault(); dzLogo.classList.add('over');
});
['dragleave','dragend'].forEach(function(ev) {
  dzLogo.addEventListener(ev, function() { dzLogo.classList.remove('over'); });
});
dzLogo.addEventListener('drop', function(e) {
  e.preventDefault(); dzLogo.classList.remove('over');
  var f = e.dataTransfer.files[0];
  if (f) loadLogo(f);
});

function loadLogo(file) {
  var r = new FileReader();
  r.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      logoImage = img;
      dzLogo.classList.add('filled');
      dzLogo.innerHTML =
        '<div class="ico">&#9989;</div>' +
        '<p class="lbl"><strong>' + safe(file.name) + '</strong></p>' +
        '<p class="hint">' + img.naturalWidth + ' &#215; ' + img.naturalHeight + ' px</p>';
      render();
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}

/* ── Temps reel ──────────────────────────────────────────────── */
[inpRub, inpTitre, inpAuteur, inpCredit].forEach(function(el) {
  el.addEventListener('input', render);
});

function setStatus(msg, cls) {
  statusEl.innerHTML = msg;
  statusEl.className = cls || '';
}

function safe(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ================================================================
   TELECHARGEMENT
================================================================ */
btnDl.addEventListener('click', function() {
  render();
  var slug = (inpTitre.value || 'onoris-visuel')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,48);
  var a = document.createElement('a');
  a.href     = canvas.toDataURL('image/png');
  a.download = 'onoris-' + slug + '.png';
  a.click();
  setStatus('Telechargement lance &#10003;', 'ok');
});

/* ================================================================
   MOTEUR DE RENDU
================================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);

  /* Placeholder sans image */
  if (!bgImage) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.font         = '500 22px "Inter", sans-serif';
    ctx.fillStyle    = 'rgba(255,255,255,0.10)';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Deposez une image pour commencer', W/2, H/2);
    ctx.restore();
    return;
  }

  /* 1. Image de fond (cover) */
  drawBgImage();

  /* 2. Overlay degrade */
  drawOverlay();

  /* 3. Rubrique → retourne { bottom } */
  var rub = drawRubrique();

  /* 4. Titre → retourne Y bas de la derniere ligne */
  var titleBottom = drawTitle(rub.bottom + RUB_GAP);

  /* 5. Auteur */
  drawAuthor(titleBottom + TTL_GAP);

  /* 6. Credit photo (optionnel) */
  drawCredit();

  /* 7. Logo */
  drawLogo();
}

/* ================================================================
   FONCTIONS DE DESSIN
================================================================ */

/*
 * 1. IMAGE DE FOND — object-fit: cover
 */
function drawBgImage() {
  var iw    = bgImage.naturalWidth;
  var ih    = bgImage.naturalHeight;
  var scale = Math.max(W/iw, H/ih);
  var sw    = iw * scale;
  var sh    = ih * scale;
  ctx.drawImage(bgImage, (W-sw)/2, (H-sh)/2, sw, sh);
}

/*
 * 2. OVERLAY DEGRADE
 *
 * Format 4:5 : le bloc texte occupe ~35% du haut.
 * On assombrit 0-60% en haut, puis 75-100% en bas.
 */
function drawOverlay() {
  /* Base uniforme */
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  /* Degrade haut : fort en haut, disparat vers 60% */
  var top = ctx.createLinearGradient(0, 0, 0, H * 0.62);
  top.addColorStop(0.00, 'rgba(0,0,0,0.65)');
  top.addColorStop(0.45, 'rgba(0,0,0,0.22)');
  top.addColorStop(1.00, 'rgba(0,0,0,0.00)');
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, W, H * 0.62);

  /* Degrade bas : discret, pour credit et logo */
  var bot = ctx.createLinearGradient(0, H*0.72, 0, H);
  bot.addColorStop(0.0, 'rgba(0,0,0,0.00)');
  bot.addColorStop(1.0, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = bot;
  ctx.fillRect(0, H*0.72, W, H*0.28);
}

/*
 * 3. BLOC RUBRIQUE
 * Rectangle #2A3342 + Inter 700 29px majuscules + tracking 1.4px
 * Retourne { bottom } pour positionner le titre.
 */
function drawRubrique() {
  var text  = (inpRub.value.trim() || 'RUBRIQUE').toUpperCase();
  var FS    = 29;
  var PAD_H = 16;
  var PAD_V = 10;

  ctx.save();
  ctx.font          = '700 ' + FS + 'px "Inter", "Arial Black", sans-serif';
  ctx.letterSpacing = '1.4px';

  var tw    = ctx.measureText(text).width;
  var rectW = tw + PAD_H * 2;
  var rectH = FS + PAD_V * 2;

  /* Rectangle fond */
  ctx.fillStyle = RUB_BG;
  if (typeof ctx.roundRect === 'function') {
    ctx.beginPath();
    ctx.roundRect(ML, RUB_TOP, rectW, rectH, 3);
    ctx.fill();
  } else {
    ctx.fillRect(ML, RUB_TOP, rectW, rectH);
  }

  /* Texte */
  ctx.fillStyle    = '#ffffff';
  ctx.textBaseline = 'top';
  ctx.textAlign    = 'left';
  ctx.fillText(text, ML + PAD_H, RUB_TOP + PAD_V);

  ctx.restore();
  return { bottom: RUB_TOP + rectH };
}

/*
 * 4. TITRE — Noto Serif Display 400, 74px, word-wrap
 * Retourne le Y bas de la derniere ligne.
 */
function drawTitle(startY) {
  var text   = inpTitre.value || '';
  var FS     = 74;
  var LINE_H = FS * 1.20;
  var MAX_W  = W - ML - MR;

  ctx.save();
  ctx.font          = '400 ' + FS + 'px "Noto Serif Display", Georgia, serif';
  ctx.fillStyle     = '#ffffff';
  ctx.textBaseline  = 'top';
  ctx.textAlign     = 'left';
  ctx.letterSpacing = '0px';

  var lines = wordWrap(ctx, text, MAX_W);
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], ML, startY + i * LINE_H);
  }

  ctx.restore();
  return startY + lines.length * LINE_H;
}

/*
 * 5. AUTEUR — Open Sans 400, 27px
 */
function drawAuthor(startY) {
  var text = inpAuteur.value.trim();
  if (!text) return;
  ctx.save();
  ctx.font          = '400 27px "Open Sans", Arial, sans-serif';
  ctx.fillStyle     = 'rgba(255,255,255,0.92)';
  ctx.textBaseline  = 'top';
  ctx.textAlign     = 'left';
  ctx.letterSpacing = '0px';
  ctx.fillText(text, ML, startY);
  ctx.restore();
}

/*
 * 6. CREDIT PHOTO — Open Sans 400, 23px, bas-gauche, optionnel
 */
function drawCredit() {
  var text = inpCredit.value.trim();
  if (!text) return;
  ctx.save();
  ctx.font          = '400 23px "Open Sans", Arial, sans-serif';
  ctx.fillStyle     = 'rgba(255,255,255,0.80)';
  ctx.textBaseline  = 'bottom';
  ctx.textAlign     = 'left';
  ctx.letterSpacing = '0px';
  ctx.fillText(text, CREDIT_X, H - CREDIT_BOT);
  ctx.restore();
}

/*
 * 7. LOGO — bas-droite
 *
 * Si un PNG a ete uploade : on le dessine tel quel.
 *   Le PNG doit avoir un fond TRANSPARENT pour que le logo
 *   blanc s'affiche proprement sur la photo assombrie.
 *
 * Aucun logo uploade : rien n'est affiche (pas de fallback texte).
 */
function drawLogo() {
  if (!logoImage) return;

  var lh = LOGO_H;
  var lw = logoImage.naturalWidth * (lh / logoImage.naturalHeight);
  var x  = W - LOGO_MARGIN - lw;
  var y  = H - LOGO_MARGIN - lh;

  ctx.save();
  ctx.globalAlpha = 0.90;
  ctx.drawImage(logoImage, x, y, lw, lh);
  ctx.restore();
}

/* ================================================================
   UTILITAIRE : WORD WRAP
   Decoupe text en lignes de largeur <= maxWidth.
   Respecte les \n existants.
================================================================ */
function wordWrap(c, text, maxWidth) {
  if (!text) return [''];
  var out   = [];
  var paras = text.split('\n');
  for (var p = 0; p < paras.length; p++) {
    var para = paras[p];
    if (!para.trim()) { out.push(''); continue; }
    var words = para.split(/\s+/).filter(Boolean);
    var line  = '';
    for (var w = 0; w < words.length; w++) {
      var cand = line ? line + ' ' + words[w] : words[w];
      if (c.measureText(cand).width > maxWidth && line) {
        out.push(line); line = words[w];
      } else {
        line = cand;
      }
    }
    if (line) out.push(line);
  }
  return out;
}

/* Rendu initial */
render();
</script>
